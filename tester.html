<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Stream Tester</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --card: #ffffff;
        --text: #1e293b;
        --text-light: #64748b;
        --border: #e2e8f0;
        --green: #22c55e;
        --red: #ef4444;
        --amber: #f59e0b;
        --blue: #3b82f6;
        --radius: 12px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        --mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 2rem 1rem;
      }

      .container {
        width: 100%;
        max-width: 960px;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.25rem 1.5rem;
        border: 1px solid var(--border);
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      .status-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem 2rem;
      }

      .indicator {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .led {
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3);
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .led.open {
        background: var(--green);
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.3);
      }
      .led.connecting {
        background: var(--amber);
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.3);
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
        100% {
          opacity: 1;
        }
      }

      .status-text {
        font-weight: 500;
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 0.5px;
      }

      .url-bar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
      }
      .url-input {
        font-family: var(--mono);
        flex: 1;
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.8rem;
        background: #f8fafc;
        color: var(--text);
        min-width: 240px;
      }
      .url-input:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }

      .controls {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-left: auto;
      }

      button {
        background: white;
        border: 1px solid var(--border);
        padding: 0.4rem 0.9rem;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        color: var(--text);
        background: #f8fafc;
      }
      button:hover {
        background: #f1f5f9;
        border-color: #cbd5e1;
      }
      button:active {
        background: #e2e8f0;
      }
      button.primary {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      button.primary:hover {
        background: #2563eb;
      }
      button.danger {
        background: #fff1f2;
        color: #b91c1c;
        border-color: #fecaca;
      }
      button.danger:hover {
        background: #fee2e2;
      }

      .stats {
        display: flex;
        gap: 2rem;
        flex-wrap: wrap;
        font-size: 0.85rem;
        color: var(--text-light);
      }
      .stats span {
        font-weight: 600;
        color: var(--text);
      }

      .log-panel {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        max-height: 65vh;
        overflow: hidden;
      }
      .log-header {
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--border);
        font-weight: 500;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .log-actions {
        display: flex;
        gap: 0.4rem;
      }
      .log-body {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem 1rem;
        background: #fafbfc;
        font-family: var(--mono);
        font-size: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .message-entry {
        display: flex;
        gap: 0.6rem;
        border-bottom: 1px solid #f1f5f9;
        padding: 0.3rem 0;
        align-items: flex-start;
      }
      .msg-time {
        color: var(--text-light);
        white-space: nowrap;
        font-size: 0.7rem;
        min-width: 5.5rem;
      }
      .msg-counter {
        color: var(--text-light);
        font-size: 0.65rem;
        min-width: 2rem;
        text-align: right;
      }
      .msg-content {
        white-space: pre-wrap;
        word-break: break-word;
        color: #0f172a;
        flex: 1;
      }
      .msg-content.json {
        color: #075985;
      }
      .msg-content.hex {
        color: #b45309;
      }

      .debug-card {
        background: #f8fafc;
        border-radius: var(--radius);
        padding: 0.75rem 1rem;
        font-size: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        color: var(--text-light);
        border: 1px solid var(--border);
        margin-top: 0.5rem;
      }
      .debug-item {
        display: flex;
        gap: 0.4rem;
      }
      .debug-item strong {
        font-weight: 600;
        color: var(--text);
      }

      .empty-log {
        color: #94a3b8;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>📡 WebSocket Stream Tester</h1>
        <div class="url-bar">
          <input
            class="url-input"
            id="urlInput"
            value="ws://127.0.0.1:16001/stream_processed_news"
            placeholder="ws://..."
            title="WebSocket URL, Enter для подключения"
          />
          <div class="controls">
            <button id="connectBtn" class="primary">🔄 Connect</button>
            <button id="disconnectBtn" class="danger">⏹️ Disconnect</button>
            <button id="clearBtn">🗑️ Clear</button>
          </div>
        </div>
      </div>

      <!-- Status & stats -->
      <div
        class="card"
        style="display: flex; flex-direction: column; gap: 0.8rem"
      >
        <div class="status-bar">
          <div class="indicator">
            <span class="led" id="led"></span>
            <span class="status-text" id="statusText">CLOSED</span>
          </div>
          <div class="stats">
            <div>📨 Сообщений: <span id="msgCount">0</span></div>
            <div>🕛 С последнего: <span id="lastMsgTime">–</span></div>
            <div>🕒 Сессия: <span id="sessionTime">00:00</span></div>
          </div>
        </div>
        <!-- Debug: основная информация -->
        <div class="debug-card" id="debugInfo">
          <div class="debug-item">
            <strong>ReadyState:</strong>
            <span id="readyState">3 (CLOSED)</span>
          </div>
          <div class="debug-item">
            <strong>Buffered:</strong>
            <span id="bufferedAmount">0</span> bytes
          </div>
          <div class="debug-item">
            <strong>Close code:</strong>
            <span id="closeCode">–</span>
          </div>
          <div class="debug-item">
            <strong>Reason:</strong> <span id="closeReason">–</span>
          </div>
        </div>
        <!-- Дополнительная статистика -->
        <div class="debug-card" id="statsCard">
          <div class="debug-item">
            <strong>🔄 Переподключений:</strong>
            <span id="reconnects">0</span>
          </div>
          <div class="debug-item">
            <strong>📊 Всего данных:</strong>
            <span id="totalBytes">0</span> B
          </div>
          <div class="debug-item">
            <strong>⌛ Средний интервал:</strong>
            <span id="avgInterval">–</span>
          </div>
          <div class="debug-item">
            <strong>🕒 Задержка последнего:</strong>
            <span id="lastLatency">–</span>
          </div>
        </div>
      </div>

      <!-- Message log -->
      <div class="log-panel">
        <div class="log-header">
          <span>📋 Лог сообщений</span>
          <div class="log-actions">
            <button id="copyBtn" title="Скопировать все сообщения">
              📋 Копировать
            </button>
            <button
              id="scrollBtn"
              title="Автоскролл: новые сообщения всегда прокручивают ленту вниз"
            >
              🔽 Авто
            </button>
          </div>
        </div>
        <div class="log-body" id="logBody">
          <div class="empty-log">Ожидание сообщений...</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        // --- CONFIG ---
        const DEFAULT_URL = "ws://127.0.0.1:16001/stream_processed_news";
        const RECONNECT_DELAY = 500;

        // --- DOM ---
        const led = document.getElementById("led");
        const statusText = document.getElementById("statusText");
        const msgCountSpan = document.getElementById("msgCount");
        const lastMsgTimeSpan = document.getElementById("lastMsgTime");
        const sessionTimeSpan = document.getElementById("sessionTime");
        const readyStateSpan = document.getElementById("readyState");
        const bufferedSpan = document.getElementById("bufferedAmount");
        const closeCodeSpan = document.getElementById("closeCode");
        const closeReasonSpan = document.getElementById("closeReason");
        const logBody = document.getElementById("logBody");
        const urlInput = document.getElementById("urlInput");

        const connectBtn = document.getElementById("connectBtn");
        const disconnectBtn = document.getElementById("disconnectBtn");
        const clearBtn = document.getElementById("clearBtn");
        const copyBtn = document.getElementById("copyBtn");
        const scrollBtn = document.getElementById("scrollBtn");

        // Статистика
        const reconnectsSpan = document.getElementById("reconnects");
        const totalBytesSpan = document.getElementById("totalBytes");
        const avgIntervalSpan = document.getElementById("avgInterval");
        const lastLatencySpan = document.getElementById("lastLatency");

        // --- State ---
        let ws = null;
        let messageCounter = 0;
        let lastMessageTimestamp = null; // Date
        let sessionStart = null;
        let sessionTimerInterval = null;
        let manualClose = false;
        let autoScroll = true;

        // Статистика
        let reconnectCount = 0;
        let totalBytes = 0;
        let lastMessageTimestamps = []; // массив Date для расчёта среднего интервала
        const MAX_INTERVAL_HISTORY = 10; // сколько последних интервалов учитываем

        // --- Helpers ---
        function formatTime(date) {
          return (
            date.toLocaleTimeString("ru-RU", { hour12: false }) +
            "." +
            String(date.getMilliseconds()).padStart(3, "0")
          );
        }

        function formatDuration(ms) {
          if (ms <= 0) return "00:00";
          const totalSeconds = Math.floor(ms / 1000);
          const mins = Math.floor(totalSeconds / 60);
          const secs = totalSeconds % 60;
          return (
            String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0")
          );
        }

        function updateSessionTimer() {
          if (sessionStart) {
            sessionTimeSpan.textContent = formatDuration(
              Date.now() - sessionStart,
            );
          } else {
            sessionTimeSpan.textContent = "00:00";
          }
        }

        function startSessionTimer() {
          if (sessionTimerInterval) clearInterval(sessionTimerInterval);
          sessionStart = Date.now();
          updateSessionTimer();
          sessionTimerInterval = setInterval(updateSessionTimer, 1000);
        }

        function stopSessionTimer() {
          if (sessionTimerInterval) {
            clearInterval(sessionTimerInterval);
            sessionTimerInterval = null;
          }
          sessionStart = null;
          sessionTimeSpan.textContent = "00:00";
        }

        function updateLastMessageTime() {
          if (lastMessageTimestamp) {
            lastMsgTimeSpan.textContent = formatDuration(
              Date.now() - lastMessageTimestamp,
            );
          } else {
            lastMsgTimeSpan.textContent = "–";
          }
        }
        setInterval(updateLastMessageTime, 1000);

        function updateDebugInfo() {
          if (ws) {
            const state = ws.readyState;
            const stateNames = ["CONNECTING", "OPEN", "CLOSING", "CLOSED"];
            readyStateSpan.textContent = `${state} (${stateNames[state] || "UNKNOWN"})`;
            bufferedSpan.textContent = ws.bufferedAmount;
          } else {
            readyStateSpan.textContent = "3 (CLOSED)";
            bufferedSpan.textContent = "0";
          }
        }

        function setStatus(state) {
          led.className = "led";
          if (state === "connecting") {
            led.classList.add("connecting");
            statusText.textContent = "CONNECTING";
          } else if (state === "open") {
            led.classList.add("open");
            statusText.textContent = "OPEN";
          } else {
            statusText.textContent = "CLOSED";
          }
          updateDebugInfo();
        }

        async function decodeBinary(data) {
          if (data instanceof Blob) {
            try {
              return await data.text();
            } catch (e) {
              const buffer = await data.arrayBuffer();
              return Array.from(new Uint8Array(buffer))
                .map((b) => b.toString(16).padStart(2, "0"))
                .join(" ");
            }
          } else if (data instanceof ArrayBuffer) {
            try {
              return new TextDecoder("utf-8", {
                fatal: true,
              }).decode(data);
            } catch (e) {
              return Array.from(new Uint8Array(data))
                .map((b) => b.toString(16).padStart(2, "0"))
                .join(" ");
            }
          } else if (typeof data === "string") {
            return data;
          } else {
            return String(data);
          }
        }

        // Обновление расширенной статистики
        function updateStats(text, timestamp) {
          // Общий объем данных
          const byteLength = new Blob([text]).size;
          totalBytes += byteLength;
          totalBytesSpan.textContent = totalBytes.toLocaleString();

          // Добавляем метку времени в историю (для интервалов)
          lastMessageTimestamps.push(timestamp);
          if (lastMessageTimestamps.length > MAX_INTERVAL_HISTORY) {
            lastMessageTimestamps.shift();
          }

          // --- Задержка последнего (интервал между последним и предпоследним) ---
          if (lastMessageTimestamps.length >= 2) {
            const len = lastMessageTimestamps.length;
            const lastInterval =
              lastMessageTimestamps[len - 1] - lastMessageTimestamps[len - 2];
            lastLatencySpan.textContent =
              (lastInterval / 1000).toFixed(3) + " с";
          } else {
            lastLatencySpan.textContent = "–";
          }

          // --- Средний интервал (по последним MAX_INTERVAL_HISTORY сообщениям) ---
          if (lastMessageTimestamps.length >= 2) {
            let sumDiff = 0;
            for (let i = 1; i < lastMessageTimestamps.length; i++) {
              sumDiff +=
                lastMessageTimestamps[i] - lastMessageTimestamps[i - 1];
            }
            const avg = sumDiff / (lastMessageTimestamps.length - 1);
            avgIntervalSpan.textContent = (avg / 1000).toFixed(3) + " с";
          } else {
            avgIntervalSpan.textContent = "–";
          }
        }

        function addMessageToLog(text, timestamp = new Date()) {
          messageCounter++;
          msgCountSpan.textContent = messageCounter;
          lastMessageTimestamp = timestamp;
          updateLastMessageTime();

          // Статистика
          updateStats(text, timestamp);

          const entry = document.createElement("div");
          entry.className = "message-entry";

          const timeSpan = document.createElement("span");
          timeSpan.className = "msg-time";
          timeSpan.textContent = formatTime(timestamp);

          const counterSpan = document.createElement("span");
          counterSpan.className = "msg-counter";
          counterSpan.textContent = "#" + messageCounter;

          const contentSpan = document.createElement("span");
          contentSpan.className = "msg-content";

          let displayText = text;
          try {
            const parsed = JSON.parse(text);
            displayText = JSON.stringify(parsed, null, 2);
            contentSpan.classList.add("json");
          } catch (e) {
            if (/^[0-9a-fA-F ]+$/.test(text) && text.length > 20) {
              contentSpan.classList.add("hex");
            }
          }
          contentSpan.textContent = displayText;

          entry.appendChild(timeSpan);
          entry.appendChild(counterSpan);
          entry.appendChild(contentSpan);
          logBody.appendChild(entry);

          const empty = logBody.querySelector(".empty-log");
          if (empty) empty.remove();

          // АВТОСКРОЛЛ: всегда вниз, если включён
          if (autoScroll) {
            logBody.scrollTop = logBody.scrollHeight;
          }
        }

        function clearLog() {
          logBody.innerHTML =
            '<div class="empty-log">Ожидание сообщений...</div>';
          messageCounter = 0;
          msgCountSpan.textContent = "0";
          lastMessageTimestamp = null;
          updateLastMessageTime();
          // Сбрасываем статистику только сообщений, остальное остаётся (reconnects, totalBytes – пусть копятся)
          // По желанию можно сбросить totalBytes и avgInterval, но я оставлю накопление.
          // lastMessageTimestamps не очищаем, чтобы средний интервал сохранялся.
          // Но если хотите полный сброс, раскомментируйте:
          // totalBytes = 0;
          // totalBytesSpan.textContent = '0';
          // lastMessageTimestamps = [];
          // avgIntervalSpan.textContent = '–';
          // lastLatencySpan.textContent = '–';
        }

        function incrementReconnects() {
          reconnectCount++;
          reconnectsSpan.textContent = reconnectCount;
        }

        // --- WebSocket ---
        function connect(url) {
          if (
            ws &&
            (ws.readyState === WebSocket.OPEN ||
              ws.readyState === WebSocket.CONNECTING)
          ) {
            if (ws.url === url) return;
            manualClose = true;
            ws.close(1000, "Changing URL");
          }

          manualClose = false;
          try {
            ws = new WebSocket(url);
          } catch (e) {
            console.error("WebSocket creation error:", e);
            setStatus("closed");
            return;
          }

          setStatus("connecting");
          updateDebugInfo();

          const connectTimeout = setTimeout(() => {
            if (ws && ws.readyState === WebSocket.CONNECTING) {
              console.warn("WebSocket connection timeout, forcing close");
              ws.close(4000, "Connection timeout");
            }
          }, 1000);

          ws.onopen = () => {
            clearTimeout(connectTimeout);
            console.log("WebSocket open:", url);
            setStatus("open");
            closeCodeSpan.textContent = "–";
            closeReasonSpan.textContent = "–";
            startSessionTimer();
            updateDebugInfo();
          };

          ws.onmessage = async (event) => {
            const decoded = await decodeBinary(event.data).catch(
              (e) => "[Decode error]",
            );
            addMessageToLog(decoded);
          };

          ws.onerror = (error) => {
            console.error("WebSocket error:", error);
            updateDebugInfo();
          };

          ws.onclose = (event) => {
            clearTimeout(connectTimeout);
            console.log("WebSocket closed:", event.code, event.reason);
            setStatus("closed");
            stopSessionTimer();
            closeCodeSpan.textContent = event.code || "–";
            closeReasonSpan.textContent = event.reason || "–";
            updateDebugInfo();
            ws = null;

            if (!manualClose) {
              incrementReconnects();
              setTimeout(() => {
                if (!manualClose) {
                  console.log("Reconnecting to", url);
                  connect(url);
                }
              }, RECONNECT_DELAY);
            }
          };
        }

        function disconnect() {
          manualClose = true;
          if (ws) {
            ws.close(1000, "User closed connection");
          }
        }

        // --- UI events ---
        connectBtn.addEventListener("click", () => {
          const newUrl = urlInput.value.trim();
          if (!newUrl) return;
          urlInput.value = newUrl;
          manualClose = false;
          if (ws && ws.readyState === WebSocket.OPEN && ws.url === newUrl) {
            ws.close(1000, "Reconnect requested");
            const checkAndConnect = setInterval(() => {
              if (!ws || ws.readyState === WebSocket.CLOSED) {
                clearInterval(checkAndConnect);
                connect(newUrl);
              }
            }, 100);
          } else {
            connect(newUrl);
          }
        });

        urlInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            connectBtn.click();
          }
        });

        disconnectBtn.addEventListener("click", disconnect);

        clearBtn.addEventListener("click", clearLog);

        copyBtn.addEventListener("click", () => {
          const messages = Array.from(
            logBody.querySelectorAll(".message-entry .msg-content"),
          )
            .map((el) => el.textContent)
            .join("\n");
          navigator.clipboard
            .writeText(messages)
            .then(() => {
              alert("Сообщения скопированы.");
            })
            .catch(() => {
              alert("Ошибка копирования.");
            });
        });

        scrollBtn.addEventListener("click", () => {
          autoScroll = !autoScroll;
          scrollBtn.textContent = autoScroll ? "🔽 Авто" : "🔽 Ручная";
          scrollBtn.title = autoScroll
            ? "Автоскролл: каждое новое сообщение прокручивает ленту вниз"
            : "Ручная прокрутка: лента не двигается";
          if (autoScroll) {
            logBody.scrollTop = logBody.scrollHeight;
          }
        });

        // --- Инициализация ---
        urlInput.value = DEFAULT_URL;
        connect(DEFAULT_URL);

        setInterval(updateDebugInfo, 500);
      })();
    </script>
  </body>
</html>
